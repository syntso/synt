name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventional:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            build
            ci
            chore
            style
            revert
          subjectPattern: ^[a-z0-9].*[^.]$
          subjectPatternError: Start the subject lowercase and leave out the final period.
