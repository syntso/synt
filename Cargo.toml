[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE.md"
repository = "https://github.com/syntso/synt"
publish = false

[workspace.dependencies]
synt-actions = { path = "crates/actions" }
synt-client = { path = "crates/client" }
synt-journal = { path = "crates/journal" }
synt-platform = { path = "crates/platform" }
synt-proto = { path = "crates/proto" }
synt-ssh = { path = "crates/ssh" }

bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
proptest = "1.12.0"
russh = { version = "0.64.1", default-features = false, features = ["ring"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
ssh2-config = "0.8.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.2"
tokio-util = { version = "0.7.20", features = ["codec"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unused_async_trait_impl = "allow"
