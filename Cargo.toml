[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE.md"
repository = "https://github.com/syntso/synt"
publish = false

[workspace.dependencies]
synt-actions = { path = "crates/actions" }
synt-client = { path = "crates/client" }
synt-db = { path = "crates/db" }
synt-extensions = { path = "crates/extensions" }
synt-journal = { path = "crates/journal" }
synt-kube = { path = "crates/kube" }
synt-platform = { path = "crates/platform" }
synt-proto = { path = "crates/proto" }
synt-ssh = { path = "crates/ssh" }
synt-sync = { path = "crates/sync" }
synt-test-servers = { path = "crates/test-servers" }

bytes = "1.12.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.7", features = ["derive"] }
core-foundation = "0.10.1"
data-encoding = "2.11.1"
directories = "6.0.0"
fallible-iterator = "0.2.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
http = "1.5.0"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
interprocess = { version = "2.4.5", features = ["tokio"] }
jiff = "0.2.38"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
keyring-core = "1.0.1"
kube = { version = "4.2.0", default-features = false, features = ["client", "config", "ring", "rustls-tls", "ws"] }
minisign = "0.10.0"
mysql_async = { version = "0.37.1", default-features = false, features = ["default-rustls-ring"] }
minisign-verify = "0.3.0"
nix = { version = "0.31.3", default-features = false, features = ["signal", "socket", "user"] }
notify = "8.2.0"
portable-pty = "0.9.0"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp"] }
postgres-protocol = "0.6.12"
proptest = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
russh = { version = "0.64.1", default-features = false, features = ["ring"] }
russh-sftp = "3.0.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.5"
schemars = "1.2.3"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
similar = "3.2.0"
sqlparser = { version = "0.63.0", features = ["visitor"] }
ssh2-config = "0.8.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.2"
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = "0.14.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.1.8"
toml_edit = { version = "0.25.17", default-features = false, features = ["display", "parse"] }
tower = { version = "0.5.3", features = ["util"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls-no-provider"] }
vte = { version = "0.15.0", default-features = false }
wasmtime = { version = "49.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p2"] }
wat = "1.262.0"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unused_async_trait_impl = "allow"

[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.regalloc2]
opt-level = 2

[profile.dev.package.wasmparser]
opt-level = 2
