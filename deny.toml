[graph]
all-features = true

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_bindgen"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_udl"
allow = ["MPL-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
