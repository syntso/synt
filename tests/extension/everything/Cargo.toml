[package]
name = "everything"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license-file = "../../../LICENSE.md"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0.154"
synt-extension-api = { git = "https://github.com/syntso/extension-api", rev = "1893f0c14685819bc243ea2f0bf4044c210c7dc1" }

[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
